      <div class="login-page__shell">
        <div class="container">
          <div class="row">
            <div class="col-xl-12">
              <div class="d-flex justify-content-center">
                <a class="login-page__logo" href=""
                  ><img src="img/logo.svg" alt=""
                /></a>
              </div>
              <div class="d-flex justify-content-center">
                <form class="registration-form" action="">
                  <h1 class="registration-form__headline"></h1>
                  <label
                    class="login-form__label"
                    for="registration-form__contact"
                    >Имя</label
                  >
                  <input
                    class="registration-form__input"
                    id="registration-form__contact"
                    required=""
                    placeholder="Введите ваше имя"
                    type="text"
                  />
                  <label
                    class="login-form__label"
                    for="registration-form__phone"
                    >Телефон</label
                  >
                  <div class="registration-form__phone">
                    <div class="registration-form__phone__prefix">
                      <select class="registration-form__select" name="">
                        <option value="">+7</option>
                      </select>
                    </div>
                    <div class="registration-form__phone__numbers">
                      <input
                        class="registration-form__input"
                        id="registration-form__phone"
                        required=""
                        placeholder="Ваш номер телефона"
                        type="text"
                      />
                    </div>
                  </div>
                  <label class="login-form__label" for="registration-form__mail"
                    >Почта</label
                  >
                  <input
                    class="registration-form__input registration-form__input_mail"
                    id="registration-form__mail"
                    required=""
                    placeholder="Введите ваш Email"
                    type="text"
                  />
                  <div class="registration-form__checkbox">
                    <div class="registration-form__checkbox">
                      <label class="registration-form__checkbox__label">
                        <input
                          required=""
                          checked=""
                          type="checkbox"
                        /><span></span>
                      </label>
                      <p
                        class="registration-form__checkbox__consent-privacy-policy"
                      >
                        Согласие с
                        <a href="policy">Политикой конфиденциальности</a>
                      </p>
                    </div>
                  </div>
                  <button class="registration-form__send"></button>
                </form>
              </div>
              <div class="d-flex justify-content-center">
                <p class="you-dont-have-account">
                  Есть аккаунт?
